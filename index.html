        window.limparNomeFornecedor = function(nome) {
            let str = String(nome || '').trim().toUpperCase();
            if (!str) return '';
            if (!str.match(/^5\s+ESTRELAS/i)) {
                str = str.replace(/[\s\-_]*\d+$/, '').trim();
            }
            return str;
        };

        window.obterListaNomesFornecedores = function() {
            const conjuntoUnico = new Set();
            listaPadrao60Fornecedores.forEach(item => {

                if (limpo) conjuntoUnico.add(limpo);
            });
            if (Array.isArray(window.mapaCredenciaisFornecedores)) {
                window.mapaCredenciaisFornecedores.forEach(item => {
                    const limpo = window.limparNomeFornecedor(item.empresa);
                    if (limpo) conjuntoUnico.add(limpo);
                });
            }
            const todos = [...(window.ymsStore.agendamentos || []), ...(window.ymsStore.rascunhoAgendamentos || [])];
            todos.forEach(ag => {
                if (ag && ag.fornecedor) {
                    const limpo = window.limparNomeFornecedor(ag.fornecedor);
                    if (limpo) conjuntoUnico.add(limpo);
                }
            });
            return Array.from(conjuntoUnico).sort((a, b) => a.localeCompare(b, 'pt-BR'));
        };

        window.horaParaMinutos = function(horaStr) {
            if (!horaStr || horaStr === '---') return 0;
            const partes = String(horaStr).trim().split(':');
            return parseInt(partes[0], 10) * 60 + parseInt(partes[1] || 0, 10);
        };

        window.dataEhPassada = function(dataStr) {
            if (!dataStr) return false;
            let ano, mes, dia;
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                dia = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; ano = parseInt(partes[2], 10);
            } else if (dataStr.includes('-')) {
                const partes = dataStr.split('-');
                ano = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; dia = parseInt(partes[2], 10);
            } else { return false; }
            const dataAgendada = new Date(ano, mes, dia);
            const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
            return dataAgendada < hoje;
        };

        window.obterDataHojeISO = function() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        };

        window.obterDataHojePtBR = function() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            return `${dia}/${mes}/${ano}`;
        };

        window.obterDiaSemanaPtBR = function(dataStr) {
            if (!dataStr) return "-";
            let dia, mes, ano;
            if (dataStr.includes('/')) {
                const p = dataStr.split('/');
                dia = parseInt(p[0], 10); mes = parseInt(p[1], 10) - 1; ano = parseInt(p[2], 10);
            } else if (dataStr.includes('-')) {
                const p = dataStr.split('-');
                ano = parseInt(p[0], 10); mes = parseInt(p[1], 10) - 1; dia = parseInt(p[2], 10);
            } else { return "-"; }
            const d = new Date(ano, mes, dia);
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            return dias[d.getDay()] || "-";
        };

        window.formatarHoraIso = function(isoStr) {
            if (!isoStr) return "-";
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return String(isoStr);
                return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch(e) { return "-"; }
        };

        window.calcularDiferencaHorasFormatada = function(horaIniStr, horaFimStr) {
            if (!horaIniStr || !horaFimStr || horaIniStr === '-' || horaFimStr === '-') return "-";
            const minIni = window.horaParaMinutos(horaIniStr);
            let minFim = window.horaParaMinutos(horaFimStr);
            if (minFim < minIni) minFim += 1440;
            const diff = Math.max(0, minFim - minIni);
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}h`;
        };

        window.calcularSlaTicket = function(agendamento) {
            if (!agendamento || !agendamento.horaIni) return "NO HORÁRIO";
            const agora = new Date();
            const minAtuais = agora.getHours() * 60 + agora.getMinutes();
            const minAgendado = window.horaParaMinutos(agendamento.horaIni);
            const diff = minAtuais - minAgendado;
            if (diff > 15) return "ATRASADO";
            if (diff < -15) return "ADIANTADO";
            return "NO HORÁRIO";
        };

        window.confirmarLoginComSenha = function() {
            const userDig = document.getElementById('inputUserLogin')?.value.trim();
            const pinDig = document.getElementById('inputPinLogin')?.value.trim();
            const perfilSel = window.ymsStore.perfilSolicitadoTemp;
            if ((userDig.toLowerCase() === "admin" || userDig === "") && (pinDig === "1234" || pinDig === "admin" || pinDig === "123")) {
                window.concluirLoginPerfil('admin', 'Administrador', ['pcp','fornecedor','totem','fiscal','doca','checkout','motoristas','torre']);

            }
            const usrEncontrado = (window.ymsStore.baseUsuariosCustom || []).find(u => u.login.toLowerCase() === userDig.toLowerCase() && u.senha === pinDig);

        window.concluirLoginPerfil = function(keyPerfil, nomeExibicao, modulosPermitidos, abaParaAbrir = null) {
            const targetAba = abaParaAbrir || modulosPermitidos[0];
            const sessaoData = { key: keyPerfil, nome: nomeExibicao, modulosCustom: modulosPermitidos, abaAtiva: targetAba };
            window.ymsStore.usuarioLogado = sessaoData;
            localStorage.setItem('yms_sessao_usuario', JSON.stringify(sessaoData));
            const modalLogin = document.getElementById('modalLoginGlobal');
            if (modalLogin) modalLogin.classList.add('hidden');
            const lblUser = document.getElementById('lblNomeUsuarioLogado');
            if (lblUser) lblUser.textContent = `Sair (${nomeExibicao})`;

            const navBar = document.getElementById('navBarPerfis');
            if (keyPerfil === 'totem' || (modulosPermitidos.length === 1 && modulosPermitidos[0] === 'totem')) {
                if (navBar) navBar.classList.add('hidden');
            } else {
                if (navBar) navBar.classList.remove('hidden');
                document.querySelectorAll('#navBarPerfis button').forEach(btn => {
                    const moduloBtn = btn.getAttribute('data-modulo');
                    if (modulosPermitidos.includes(moduloBtn)) { btn.classList.remove('hidden'); } else { btn.classList.add('hidden'); }
                });
            }
            if (typeof window.mudarPerfil === 'function') {
                window.mudarPerfil(targetAba);
            }
        };

        window.restaurarSessaoLocal = function() {
            try {
                const sessaoSalva = localStorage.getItem('yms_sessao_usuario');
                const empForSalva = localStorage.getItem('yms_empresa_fornecedor_logada');
                if (empForSalva) { window.ymsStore.empresaFornecedorLogada = empForSalva; }
                if (sessaoSalva) {
                    const parsed = JSON.parse(sessaoSalva);
                    if (parsed && parsed.key && parsed.modulosCustom) {
                        window.concluirLoginPerfil(parsed.key, parsed.nome, parsed.modulosCustom, parsed.abaAtiva || parsed.modulosCustom[0]);
                        return true;
                    }
                }
            } catch(e) {
                console.error("Erro ao restaurar sessão:", e);
            }
            const modalLogin = document.getElementById('modalLoginGlobal');
            if (modalLogin) modalLogin.classList.remove('hidden');
            return false;
        };

        window.mudarPerfil = function(perfilId) {
            if (window.ymsStore.usuarioLogado && !window.ymsStore.usuarioLogado.modulosCustom.includes(perfilId)) {
                alert("Acesso negado a este módulo!");
                return;
            }

            if (window.ymsStore.usuarioLogado) {
                window.ymsStore.usuarioLogado.abaAtiva = perfilId;
                localStorage.setItem('yms_sessao_usuario', JSON.stringify(window.ymsStore.usuarioLogado));
            }

            document.querySelectorAll('.perfil-modulo').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.btn-perfil').forEach(btn => {
                btn.className = "btn-perfil px-3 py-1.5 rounded-lg font-bold text-xs text-slate-400 hover:text-white";
            });

            const targetModulo = document.getElementById(`perfil-${perfilId}`);
            if (targetModulo) targetModulo.classList.remove('hidden');
            const btnAtivo = document.getElementById(`btn-${perfilId}`);
            if (btnAtivo) {
                btnAtivo.className = "btn-perfil px-3 py-1.5 rounded-xl font-bold text-xs bg-indigo-600 text-white shadow";

        // --- 4. CONTROLE DE HORÁRIOS DO PCP ---
        window.atualizarHorariosDisponiveis = function() {
            const inpHora = document.getElementById('inpHora');
            const gridTimeline = document.getElementById('gridTimelineHorarios');
            const docaSel = document.getElementById('inpDoca')?.value;
            const dataSelRaw = document.getElementById('inpData')?.value;

            if (!inpHora) return;

            let dataSelFormatted = "";
            if (dataSelRaw) {
                const p = dataSelRaw.split('-');
                dataSelFormatted = `${p[2]}/${p[1]}/${p[0]}`;
            }

            const todosAg = [...(window.ymsStore.agendamentos || []), ...(window.ymsStore.rascunhoAgendamentos || [])];
            const agendamentosOcupados = todosAg.filter(a => 
                window.normalizarTexto(a.doca) === window.normalizarTexto(docaSel) &&
                window.normalizarTexto(a.data) === window.normalizarTexto(dataSelFormatted)
            );

            inpHora.innerHTML = "";
            if (gridTimeline) gridTimeline.innerHTML = "";

            slotsDia24h.forEach(slot => {
                const minSlot = window.horaParaMinutos(slot);
                const ehOcupado = agendamentosOcupados.some(a => {
                    const minIni = window.horaParaMinutos(a.horaIni);
                    const minFim = window.horaParaMinutos(a.horaFim);
                    return minSlot >= minIni && minSlot < minFim;
                });

                const opt = document.createElement('option');
                opt.value = slot;
                opt.textContent = slot + (ehOcupado ? " (Ocupado)" : "");
                if (ehOcupado) opt.classList.add('text-red-400');
                inpHora.appendChild(opt);

                if (gridTimeline) {
                    const btn = document.createElement('button');
                    btn.type = "button";
                    btn.className = `p-1 text-[10px] font-mono font-bold rounded ${ehOcupado ? 'bg-red-950/80 text-red-400 border border-red-500/30' : 'bg-slate-900 text-emerald-400 hover:bg-emerald-600 hover:text-white transition cursor-pointer'}`;
                    btn.textContent = slot;
                    btn.onclick = () => {
                        if (!ehOcupado) {
                            inpHora.value = slot;
                            if (typeof window.atualizarHorarioFimMinimo === 'function') {
                                window.atualizarHorarioFimMinimo();
                            }
                        }
                    };
                    gridTimeline.appendChild(btn);
                }
            });

            if (typeof window.atualizarHorarioFimMinimo === 'function') {
                window.atualizarHorarioFimMinimo();
            }
        };

        window.atualizarHorarioFimMinimo = function() {
            const inpHora = document.getElementById('inpHora');
            const inpHoraFim = document.getElementById('inpHoraFim');
            if (!inpHora || !inpHoraFim) return;

            const horaIni = inpHora.value;
            const minIni = window.horaParaMinutos(horaIni);
            inpHoraFim.innerHTML = "";

            slotsDia24h.forEach(slot => {
                const minSlot = window.horaParaMinutos(slot);
                if (minSlot > minIni) {
                    const opt = document.createElement('option');
                    opt.value = slot;
                    opt.textContent = slot;
                    inpHoraFim.appendChild(opt);
                }
            });

            if (inpHoraFim.options.length > 0) {
                inpHoraFim.selectedIndex = 0;
            }
        };

            const rawDataSel = filtroEl.value.split('-');
            const dataFiltroFormatted = `${rawDataSel[2]}/${rawDataSel[1]}/${rawDataSel[0]}`;

            let empresaFiltroAlvo = "";
            const empresaLogada = window.ymsStore.empresaFornecedorLogada || 
                                  localStorage.getItem('yms_empresa_fornecedor_logada') || 
                                  localStorage.getItem('yms_usuario_logado');

            } else {

                let selHtml = `<select id="selFornFiltroPortal" onchange="renderizarModuloFornecedor()" class="w-full bg-slate-900 border border-indigo-500/60 rounded-xl p-2 text-xs font-black text-amber-300 outline-none cursor-pointer">`;

            const empAlvoNorm = window.normalizarTexto(empresaFiltroAlvo);

                const bateData = window.normalizarTexto(i.data) === window.normalizarTexto(dataFiltroFormatted);
                let bateEmpresa = false;
                if (empAlvoNorm) {
                    const fornItemNorm = window.normalizarTexto(window.limparNomeFornecedor(i.fornecedor));
                    bateEmpresa = fornItemNorm.includes(empAlvoNorm) || empAlvoNorm.includes(fornItemNorm);
                }
                return bateData && bateEmpresa;

                document.getElementById('fornCelular').value = '';

        window.renderizarGradePCP = function() {
            const container = document.getElementById('containerJanelas');
            if (!container) return;
            container.innerHTML = "";

            const todasJanelasExibicao = [...(window.ymsStore.rascunhoAgendamentos || []), ...(window.ymsStore.agendamentos || [])];
            const contadorEl = document.getElementById('contadorJanelas');
            if (contadorEl) contadorEl.textContent = todasJanelasExibicao.length;

            if (todasJanelasExibicao.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-10" id="msgVazio">Nenhuma janela carregada no sistema.</p>`;
                if (document.getElementById('painelAcaoSubir')) document.getElementById('painelAcaoSubir').classList.add('hidden');
                if (document.getElementById('subtituloGrade')) document.getElementById('subtituloGrade').textContent = "Grade de Agendamentos Vazia";
                if (typeof window.atualizarHorariosDisponiveis === 'function') window.atualizarHorariosDisponiveis();
                return;
            }

            const janelasCriticasRascunho = (window.ymsStore.rascunhoAgendamentos || []).filter(i => i.tipo === 'CRITICA');
            const btnEmailCritico = document.getElementById('btnAlertaEmailCritico');

            if ((window.ymsStore.rascunhoAgendamentos || []).length > 0) {
                if (document.getElementById('painelAcaoSubir')) document.getElementById('painelAcaoSubir').classList.remove('hidden');
                if (document.getElementById('subtituloGrade')) document.getElementById('subtituloGrade').textContent = `⚠️ ${window.ymsStore.rascunhoAgendamentos.length} Janela(s) em Rascunho - Clique no Botão Verde para Subir ao Sistema`;
                
                if (btnEmailCritico) {
                    if (janelasCriticasRascunho.length > 0) {
                        btnEmailCritico.classList.remove('hidden');
                    } else {
                        btnEmailCritico.classList.add('hidden');
                    }
                }
            } else {
                if (document.getElementById('painelAcaoSubir')) document.getElementById('painelAcaoSubir').classList.add('hidden');
                if (document.getElementById('subtituloGrade')) document.getElementById('subtituloGrade').textContent = "🟢 Todas as janelas listadas estão ativas e sincronizadas no YMS";
                if (btnEmailCritico) btnEmailCritico.classList.add('hidden');
            }

            todasJanelasExibicao.forEach(item => {
                const ehRascunho = item.isRascunho || (window.ymsStore.rascunhoAgendamentos || []).some(r => r.ordem === item.ordem);
                let badgeTag = ehRascunho 
                    ? `<span class="text-[10px] font-mono font-bold text-amber-400 bg-amber-950/80 border border-amber-500/50 px-2 py-0.5 rounded">📝 RASCUNHO (PENDENTE SUBIDA)</span>`
                    : `<span class="text-[10px] font-mono font-bold text-emerald-400 bg-emerald-950/80 border border-emerald-500/50 px-2 py-0.5 rounded">🟢 ${item.status}</span>`;

                let tipoBadge = '';
                if (item.tipo === 'CRITICA') {

        // --- 6. TORRE DE CONTROLE & GRÁFICOS (COM FILTRO DE DATA ATIVO) ---
        window.carregarGraficosTorre = function() {
            setTimeout(() => {
                if (instanceChartCheckin) { instanceChartCheckin.destroy(); instanceChartCheckin = null; }
                if (instanceChartDocas) { instanceChartDocas.destroy(); instanceChartDocas = null; }
                if (instanceChartMediaTempo) { instanceChartMediaTempo.destroy(); instanceChartMediaTempo = null; }

                const dataIniVal = document.getElementById('repDataInicio')?.value;
                const dataFimVal = document.getElementById('repDataFim')?.value;

                let dIni = null, dFim = null;
                if (dataIniVal) {
                    const p = dataIniVal.split('-');
                    dIni = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                    dIni.setHours(0, 0, 0, 0);
                }
                if (dataFimVal) {
                    const p = dataFimVal.split('-');
                    dFim = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
                    dFim.setHours(23, 59, 59, 999);
                }

                const todosAg = (window.ymsStore && window.ymsStore.agendamentos) ? window.ymsStore.agendamentos : [];
                
                const agendamentos = todosAg.filter(ag => {
                    if (!ag.data) return true;
                    let dAg = null;
                    if (ag.data.includes('/')) {
                        const pt = ag.data.split('/');
                        dAg = new Date(parseInt(pt[2], 10), parseInt(pt[1], 10) - 1, parseInt(pt[0], 10));
                    } else if (ag.data.includes('-')) {
                        const pt = ag.data.split('-');
                        dAg = new Date(parseInt(pt[0], 10), parseInt(pt[1], 10) - 1, parseInt(pt[2], 10));
                    }
                    if (!dAg) return true;
                    if (dIni && dAg < dIni) return false;
                    if (dFim && dAg > dFim) return false;
                    return true;
                });

                const totalAg = agendamentos.length;
                const concluidos = agendamentos.filter(i => i.status === 'CONCLUIDO').length;
                const emPatio = agendamentos.filter(i => 
                    i.status === 'CHECKIN_PATIO' || i.status === 'TRIAGEM_FISCAL' || 
                    i.status === 'EM_DESCARGA' || i.status === 'AGUARDANDO_CHECKOUT'
                ).length;
                const pendentes = agendamentos.filter(i => 
                    i.status === 'AGENDADO' || i.status === 'CONFIRMADO_FORNECEDOR'
                ).length;
                const outros = Math.max(0, totalAg - emPatio - concluidos - pendentes);

                const canvasCheckin = document.getElementById('chartCheckin');
                if (canvasCheckin) {
                    instanceChartCheckin = new Chart(canvasCheckin, {
                        type: 'pie',
                        data: {
                            labels: ['Em Pátio', 'Concluídos', 'Pendentes/Agendados', 'Outros'],
                            datasets: [{ 
                                data: [emPatio, concluidos, pendentes, outros], 
                                backgroundColor: ['#facc15', '#4ade80', '#60a5fa', '#94a3b8'] 
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }

                const contagemDocas = {};
                listaTodasDocas.forEach(d => contagemDocas[d] = 0);

                agendamentos.forEach(item => {
                    if (item.status === 'EM_DESCARGA' || item.status === 'TRIAGEM_FISCAL' || item.status === 'AGENDADO' || item.status === 'CONFIRMADO_FORNECEDOR' || item.status === 'CONCLUIDO') {
                        const docaAtual = (item.docasSequencia && item.docasSequencia.length > 0) ? item.docasSequencia[item.indexDocaAtual || 0] : item.doca;
                        const docaEncontrada = listaTodasDocas.find(d => window.normalizarTexto(d) === window.normalizarTexto(docaAtual));
                        if (docaEncontrada && contagemDocas[docaEncontrada] !== undefined) {
                            contagemDocas[docaEncontrada] += 1;
                        }
                    }
                });

                const canvasDocas = document.getElementById('chartDocas');
                if (canvasDocas) {
                    instanceChartDocas = new Chart(canvasDocas, {
                        type: 'bar',
                        data: {
                            labels: listaTodasDocas,
                            datasets: [{ label: 'Volume por Doca', data: listaTodasDocas.map(d => contagemDocas[d]), backgroundColor: '#6366f1', borderRadius: 8 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, min: 0, ticks: { stepSize: 1 } } } }
                    });
                }

                const somaTemposDoca = {};
                const qtdAgendamentosDoca = {};
                listaTodasDocas.forEach(d => { somaTemposDoca[d] = 0; qtdAgendamentosDoca[d] = 0; });

                agendamentos.forEach(item => {
                    let duracaoMinutos = 0;
                    if (item.timeInicioDescarga && item.timeFimDescarga) {
                        duracaoMinutos = Math.max(0, Math.round((new Date(item.timeFimDescarga) - new Date(item.timeInicioDescarga)) / (1000 * 60)));
                    } else if (item.horaIni && item.horaFim) {
                        const minIni = window.horaParaMinutos(item.horaIni);
                        let minFim = window.horaParaMinutos(item.horaFim);
                        if (minFim < minIni) minFim += 1440;
                        duracaoMinutos = Math.max(0, minFim - minIni);
                    }

                    const docasAfetadas = (item.docasSequencia && item.docasSequencia.length > 0) ? item.docasSequencia : [item.doca];
                    docasAfetadas.forEach(dTarget => {
                        const docaEncontrada = listaTodasDocas.find(d => window.normalizarTexto(d) === window.normalizarTexto(dTarget));
                        if (docaEncontrada && somaTemposDoca[docaEncontrada] !== undefined) {
                            somaTemposDoca[docaEncontrada] += duracaoMinutos;
                            qtdAgendamentosDoca[docaEncontrada] += 1;
                        }
                    });
                });

                const mediasDuracaoReal = listaTodasDocas.map(d => {
                    return qtdAgendamentosDoca[d] > 0 ? Math.round(somaTemposDoca[d] / qtdAgendamentosDoca[d]) : 0;
                });

                const canvasMedia = document.getElementById('chartMediaTempoDoca');
                if (canvasMedia) {
                    instanceChartMediaTempo = new Chart(canvasMedia, {
                        type: 'bar',
                        data: {
                            labels: listaTodasDocas,
                            datasets: [{ label: 'Duração Média Agendada/Real (Minutos)', data: mediasDuracaoReal, backgroundColor: '#f59e0b', borderRadius: 8 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, min: 0, ticks: { stepSize: 15 } } } }
                    });
                }

                const tbody = document.getElementById('tblPreviewRelatorio');
                if (tbody) {
                    tbody.innerHTML = "";

                    if (agendamentos.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-slate-500 italic">Nenhum ticket processado no período selecionado.</td></tr>`;
                        return;
                    }

                    agendamentos.forEach(ag => {
                        const horaEntradaReal = ag.timeCheckin ? window.formatarHoraIso(ag.timeCheckin) : (ag.horaIni || '-');
                        const horaSaidaReal = ag.timeCheckout ? window.formatarHoraIso(ag.timeCheckout) : (ag.timeFimDescarga ? window.formatarHoraIso(ag.timeFimDescarga) : (ag.horaFim || '-'));
                        const tempoDescarga = window.calcularDiferencaHorasFormatada(horaEntradaReal, horaSaidaReal);

                        const row = `
                            <tr class="hover:bg-slate-900/60 transition">
                                <td class="p-2.5 font-bold text-indigo-400">${ag.ordem || '-'}</td>
                                <td class="p-2.5 text-yellow-400 font-bold">${ag.cavalo || '-'}</td>
                                <td class="p-2.5">${window.obterDiaSemanaPtBR(ag.data)}</td>
                                <td class="p-2.5 font-bold">${window.limparNomeFornecedor ? window.limparNomeFornecedor(ag.fornecedor) : (ag.fornecedor || '-')}</td>
                                <td class="p-2.5">${ag.timeCheckin ? window.formatarHoraIso(ag.timeCheckin) : '-'}</td>
                                <td class="p-2.5">${ag.timeFiscal ? window.formatarHoraIso(ag.timeFiscal) : '-'}</td>
                                <td class="p-2.5">${(ag.docasSequencia && ag.docasSequencia.length > 0) ? ag.docasSequencia.join(" / ") : (ag.doca || '-')}</td>
                                <td class="p-2.5 text-emerald-400">${horaEntradaReal}</td>
                                <td class="p-2.5 text-emerald-400">${horaSaidaReal}</td>
                                <td class="p-2.5 font-bold text-amber-400">${tempoDescarga}</td>
                                <td class="p-2.5"><span class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[9px] font-bold border border-slate-700">${ag.statusSlaTicket || ag.status || 'AGENDADO'}</span></td>
                            </tr>
                        `;
                        tbody.insertAdjacentHTML('beforeend', row);
                    });
                }
            }, 150);
        };

                const data = snapshot.val();
                if (data) {
                    window.ymsStore.configApi = data;
                    if (typeof window.preencherFormularioConfigApi === 'function') {
                        window.preencherFormularioConfigApi();
                    }
                }
            });
        }

        // --- 8. STARTUP DA APLICAÇÃO ---
        window.inicializarAplicacao = function() {
            window.atualizarRelogioDigital();
            setInterval(window.atualizarRelogioDigital, 1000);

            const hojeIso = window.obterDataHojeISO();

            if (document.getElementById('inpData')) {
                document.getElementById('inpData').min = hojeIso;
                document.getElementById('inpData').value = hojeIso;
            }
            if (document.getElementById('filtroDataFornecedor')) {
                document.getElementById('filtroDataFornecedor').min = hojeIso;
                document.getElementById('filtroDataFornecedor').value = hojeIso;
            }
            if (document.getElementById('repDataInicio')) {
                document.getElementById('repDataInicio').value = hojeIso;
            }
            if (document.getElementById('repDataFim')) {
                document.getElementById('repDataFim').value = hojeIso;
            }

            const selDoca = document.getElementById('inpDoca');
            if (selDoca) {
                selDoca.innerHTML = "";
                listaTodasDocas.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d; opt.textContent = d;
                    selDoca.appendChild(opt);
                });
            }

            if (typeof window.atualizarHorariosDisponiveis === 'function') {
                window.atualizarHorariosDisponiveis();
            }

            window.restaurarSessaoLocal();
            inicializarEscutadoresFirebase();
        };

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', window.inicializarAplicacao);
        } else {
            window.inicializarAplicacao();
        }
    </script>
