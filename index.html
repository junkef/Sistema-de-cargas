        window.obterDataHojePtBR = function() {
            const hoje = new Date();
            const dia = String(hoje.getDate()).padStart(2, '0');
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const ano = hoje.getFullYear();
            return `${dia}/${mes}/${ano}`;
        };

        window.obterDataHojeISO = function() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;

        window.normalizarTexto = function(txt) {
            return String(txt || '').toLowerCase().replace(/\s+/g, '').trim();

        window.horaParaMinutos = function(horaStr) {
            if (!horaStr || horaStr === '---' || horaStr === 'IMEDIATO') return 0;
            const partes = String(horaStr).trim().split(':');
            return parseInt(partes[0], 10) * 60 + parseInt(partes[1] || 0, 10);
        };

        window.limparNomeFornecedor = function(nome) {
            let str = String(nome || '').trim().toUpperCase();
            if (!str) return 'FORNECEDOR';
            str = str.replace(/\s*-\s*CONFIRME\s+O\s+AGENDAMENTO.*/i, '');
            str = str.replace(/\s*-\s*CONFIRMAR.*/i, '');
            str = str.replace(/\/BRINDEC\/WELOZE.*/i, '');
            if (!str.match(/^5\s+ESTRELAS/i)) {
                str = str.replace(/[\s\-_]*\d+$/, '').trim();
            }
            return str.trim() || 'FORNECEDOR';
        };

        window.normalizarDataUniversal = function(dVal) {
            if (!dVal) return window.obterDataHojePtBR();
            const num = Number(dVal);
            if (!isNaN(num) && num > 30000) {
                const dateObj = XLSX.SSF.parse_date_code(num);
                if (dateObj) {
                    const dia = String(dateObj.d).padStart(2, '0');
                    const mes = String(dateObj.m).padStart(2, '0');
                    return `${dia}/${mes}/${dateObj.y}`;
                }
            }
            let dStr = String(dVal).trim();
            if (dStr.includes('-')) {
                const p = dStr.split('T')[0].split('-');
                if (p.length === 3) {
                    let y = p[0], m = p[1], d = p[2];
                    if (y.length === 2) y = "20" + y;
                    return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
                }
            }
            if (dStr.includes('/')) {
                const p = dStr.split('/');
                if (p.length === 3) {
                    let n1 = parseInt(p[0], 10);
                    let n2 = parseInt(p[1], 10);
                    let y = p[2].trim();
                    if (y.length === 2) y = "20" + y;
                    if (n1 <= 12 && n2 > 12) {
                        return `${String(n2).padStart(2, '0')}/${String(n1).padStart(2, '0')}/${y}`;
                    }
                    return `${String(n1).padStart(2, '0')}/${String(n2).padStart(2, '0')}/${y}`;
                }
            }
            return dStr;
        };

        window.normalizarDataParaISO = function(dVal) {

        window.enviarMensagemApiReal = async function(numeroTelefone, textoMensagem) {
            const cfg = window.ymsStore.configApi;
            if (!cfg || cfg.ativo !== 'SIM' || !cfg.urlEndpoint) return false;
            let numFormatado = String(numeroTelefone).replace(/\D/g, '');
            if (!numFormatado.startsWith('55') && numFormatado.length <= 11) numFormatado = '55' + numFormatado;
            try {
                let payload = {};
                let headers = { "Content-Type": "application/json" };
                if (cfg.authToken) {
                    headers["Client-Token"] = cfg.authToken;
                    headers["Authorization"] = `Bearer ${cfg.authToken}`;
                }
                if (cfg.tipo === 'whatsapp_zapi' || cfg.tipo === 'webhook_custom') {
                    payload = { phone: numFormatado, number: numFormatado, message: textoMensagem };
                } else if (cfg.tipo === 'twilio_sms') {
                    payload = { To: `+${numFormatado}`, Body: textoMensagem };
                } else if (cfg.tipo === 'zenvia_sms') {
                    payload = { from: "YMS SYSTEM", to: numFormatado, contents: [{ type: "text", text: textoMensagem }] };
                }
                const response = await fetch(cfg.urlEndpoint, { method: 'POST', headers, body: JSON.stringify(payload) });
                if (response.ok) {
                    window.exibirToast("Mensagem Enviada!", `Enviada para +${numFormatado}`, "📲");
                    return true;
                }
            } catch (err) { console.error("Falha de conexão com a API:", err); }
            return false;
        };

        window.dataEhPassada = function(dataStr) {
            if (!dataStr) return false;
            let ano, mes, dia;
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                dia = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; ano = parseInt(partes[2], 10);
            } else if (dataStr.includes('-')) {
                const partes = dataStr.split('-');
                ano = parseInt(partes[0], 10); mes = parseInt(partes[1], 10) - 1; dia = parseInt(partes[2], 10);
            } else return false;
            const dataAgendada = new Date(ano, mes, dia);
            const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
            return dataAgendada < hoje;
        };

        window.dispararSomAlerta = function() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        };

        window.atualizarHorariosDisponiveis = function() {
            const elDoca = document.getElementById('inpDoca');
            if (!elDoca || !elDoca.value) return;

            let rawData = document.getElementById('inpData')?.value;

            if (!window.slotsDia24h || window.slotsDia24h.length === 0) {
                window.slotsDia24h = [];
                for (let h = 0; h < 24; h++) {
                    for (let m of [0, 30]) {
                        window.slotsDia24h.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                    }
                }
            }

            const todos = [...(window.ymsStore.rascunhoAgendamentos || []), ...(window.ymsStore.agendamentos || [])];

            if (todos.length > 0 && todos[0].data) {
                const dataPrimeiraIso = window.normalizarDataParaISO(todos[0].data);
                if (!rawData || rawData !== dataPrimeiraIso) {
                    rawData = dataPrimeiraIso;
                    const elData = document.getElementById('inpData');
                    if (elData) elData.value = rawData;
                }
            } else if (!rawData) {
                rawData = window.obterDataHojeISO();
                const elData = document.getElementById('inpData');
                if (elData) elData.value = rawData;
            }

            const dataFormatada = window.normalizarDataUniversal(rawData);
            const docaNorm = window.normalizarTexto(elDoca.value);
            const dataNorm = window.normalizarTexto(dataFormatada);

            const ocupados = [];
            todos.forEach(item => {
                const itemDataNorm = window.normalizarTexto(window.normalizarDataUniversal(item.data));
                if (itemDataNorm === dataNorm && window.normalizarTexto(item.doca) === docaNorm && item.horaIni !== 'IMEDIATO') {
                    let minIni = window.horaParaMinutos(item.horaIni);
                    let minFim = window.horaParaMinutos(item.horaFim);
                    if (minFim <= minIni) minFim = minIni + 60;
                    ocupados.push({ ini: minIni, fim: minFim, ordem: item.ordem, fornecedor: item.fornecedor });
                }
            });

            const selIni = document.getElementById('inpHora');
            if (selIni) selIni.innerHTML = "";
            
            window.slotsDia24h.forEach(slot => {
                const minSlot = window.horaParaMinutos(slot);
                let colide = false;
                for (let oc of ocupados) {
                    if (minSlot >= oc.ini && minSlot < oc.fim) { colide = true; break; }
                }
                if (!colide && selIni) {
                    const opt = document.createElement('option');
                    opt.value = slot; opt.textContent = `${slot}h (Livre)`;
                    selIni.appendChild(opt);
                }
            });

            const gridTimeline = document.getElementById('gridTimelineHorarios');
            if (gridTimeline) {
                gridTimeline.innerHTML = "";
                window.slotsDia24h.forEach(slot => {
                    const minSlot = window.horaParaMinutos(slot);
                    let agOcupante = null;
                    for (let oc of ocupados) {
                        if (minSlot >= oc.ini && minSlot < oc.fim) { agOcupante = oc; break; }
                    }

                    if (agOcupante) {
                        gridTimeline.insertAdjacentHTML('beforeend', `

                            <div onclick="selecionarHorarioPelaGrade('${slot}')" title="Clique para selecionar ${slot}" class="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-500 hover:text-slate-950 p-1 rounded text-center text-[10px] font-mono font-bold cursor-pointer transition">
                                ${slot}
                            </div>
                        `);
                    }
                });
            }

            window.atualizarHorarioFimMinimo();
        };

        window.tratarDragOver = function(e) { e.preventDefault(); document.getElementById('dropZonePlanilha')?.classList.add('border-indigo-400'); };

        window.tratarDrop = function(e) { e.preventDefault(); window.tratarDragLeave(e); if (e.dataTransfer.files?.length > 0) window.processarArquivoEspecifico(e.dataTransfer.files[0]); };
        window.lerPlanilhaExcel = function(e) { if (e.target.files[0]) window.processarArquivoEspecifico(e.target.files[0]); };

        window.processarArquivoEspecifico = function(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false });
                if (!json || json.length === 0) { alert("Planilha vazia."); return; }
                let inseridos = 0, primeiraDataValida = null;
                json.forEach((row) => {
                    let keys = Object.keys(row);
                    let kForn = keys.find(k => k.match(/fornec|nome|empresa|cliente|razao|vendor/i));
                    let fornNome = kForn ? window.limparNomeFornecedor(row[kForn]) : "FORNECEDOR";
                    let kDoca = keys.find(k => k.match(/doca|local|gate|destino/i));
                    let docaNome = kDoca ? String(row[kDoca]).trim() : window.listaTodasDocas[0];
                    let kData = keys.find(k => k.match(/dia|data|date|agendamento/i));
                    let dataTxt = kData ? window.normalizarDataUniversal(row[kData]) : window.obterDataHojePtBR();
                    if (!primeiraDataValida) primeiraDataValida = dataTxt;
                    let kIni = keys.find(k => k.match(/entrada|inicio|início|hora.*ini|start/i));
                    let kFim = keys.find(k => k.match(/saida|saída|fim|hora.*fim|end/i));
                    let hIni = kIni && row[kIni] ? String(row[kIni]).trim() : "08:00";
                    let hFim = kFim && row[kFim] ? String(row[kFim]).trim() : "09:00";
                    const proxId = window.ymsStore.agendamentos.length + window.ymsStore.rascunhoAgendamentos.length + 1000;
                    window.ymsStore.rascunhoAgendamentos.push({
                        ordem: `ORD-${proxId}`, data: dataTxt, fornecedor: fornNome, doca: docaNome,
                        horaIni: hIni, horaFim: hFim, tipoOperacao: 'COTIDIANO', prioridadeFila: 99, status: "AGENDADO", isRascunho: true, nf: "A CONFIRMAR"
                    });
                    inseridos++;
                });
                if (primeiraDataValida && document.getElementById('inpData')) document.getElementById('inpData').value = window.normalizarDataParaISO(primeiraDataValida);
                window.garantirTodosFornecedoresNaLista();
                window.renderizarGradePCP();
                window.exibirToast("Planilha Processada!", `${inseridos} janelas lidas.`, "📊");
            };
            reader.readAsArrayBuffer(file);
        };

        window.processarTextoBruto = function() {

            const regex = /(\d{2}\/\d{2}\/\d{4})(.*?)(Doca\s*-\s*.*?)(?=\d{2}:\d{2})(\d{2}:\d{2})(\d{2}:\d{2})/g;
            let match, count = 0;
            while ((match = regex.exec(txt)) !== null) {
                count++;

                window.ymsStore.rascunhoAgendamentos.push({
                    ordem: `ORD-${proxId}`, data: window.normalizarDataUniversal(match[1]), fornecedor: window.limparNomeFornecedor(match[2]),
                    doca: match[3].trim(), horaIni: match[4], horaFim: match[5], tipoOperacao: 'COTIDIANO', prioridadeFila: 99, status: "AGENDADO", isRascunho: true, nf: "A CONFIRMAR"
                });
            }

            if (!entradaTotem) return;
            const inputLimpoNum = entradaTotem.replace(/\D/g, '');
            const ag = window.ymsStore.agendamentos.find(i => (i.cpf && String(i.cpf).replace(/\D/g, '') === inputLimpoNum) || window.normalizarTexto(i.ordem) === window.normalizarTexto(entradaTotem));
            if (!ag) { alert("Nenhum agendamento encontrado."); return; }

            ag.ticket = `T-${Math.floor(100 + Math.random() * 900)}`;
            ag.status = "CHECKIN_PATIO";
            ag.timeCheckin = new Date().toISOString();
            window.salvarAgendamentosNaMemoria();
            window.limparTotem();
            window.dispararSmsEtapa(ag, 'CHECKIN_PATIO');
        };

        window.renderizarModuloFiscal = function() {
            const container = document.getElementById('listaPatioFiscal'); if (!container) return; container.innerHTML = "";
            const emPatio = window.ymsStore.agendamentos.filter(i => i.status === 'CHECKIN_PATIO');
            document.getElementById('badgeQtdPatio').textContent = emPatio.length;
            emPatio.forEach(item => {
                container.insertAdjacentHTML('beforeend', `
                    <div onclick="selecionarTicketFiscal('${item.ticket}')" class="bg-slate-900 border border-slate-700 p-3 rounded-xl cursor-pointer">
                        <span class="bg-purple-600 text-white font-mono text-xs px-2 py-0.5 rounded">${item.ticket}</span>
                        <p class="text-xs font-black text-white mt-1">${item.cavalo || 'Placa'}</p>
                    </div>
                `);
            });
            const gridDocas = document.getElementById('gridDocasFiscal');
            if (gridDocas) {
                gridDocas.innerHTML = "";
                window.listaTodasDocas.forEach(doca => {
                    gridDocas.insertAdjacentHTML('beforeend', `<div onclick="alternarDocaNaSequencia('${doca}')" class="bg-slate-900 p-3 rounded-xl border border-slate-700 cursor-pointer"><span class="text-xs font-bold text-white">${doca}</span></div>`);
                });
            }
        };

        window.selecionarTicketFiscal = function(t) { window.ymsStore.ticketAtivoFiscal = t; window.renderizarModuloFiscal(); };
        window.alternarDocaNaSequencia = function(d) {
            if (!window.ymsStore.ticketAtivoFiscal) return;
            const idx = window.ymsStore.sequenciaDocasSelecao.indexOf(d);
            if (idx === -1) window.ymsStore.sequenciaDocasSelecao.push(d);
            else window.ymsStore.sequenciaDocasSelecao.splice(idx, 1);
        };
        window.resetarSequenciaDocas = function() { window.ymsStore.sequenciaDocasSelecao = []; };

        window.liberarParaDocaFiscal = function() {
            if (!window.ymsStore.ticketAtivoFiscal) return;
            const item = window.ymsStore.agendamentos.find(i => i.ticket === window.ymsStore.ticketAtivoFiscal);
            if (!item) return;
            item.docasSequencia = [...window.ymsStore.sequenciaDocasSelecao];
            item.indexDocaAtual = 0; item.status = "TRIAGEM_FISCAL"; item.timeFiscal = new Date().toISOString();
            window.salvarAgendamentosNaMemoria();
            window.dispararSmsEtapa(item, 'TRIAGEM_FISCAL');
        };

        window.atualizarPainelDoca = function() {
            const docaSel = document.getElementById('selDocaOperador')?.value; if (!docaSel) return;
            const containerFila = document.getElementById('listaFilaDoca'); if (containerFila) containerFila.innerHTML = "";
            const docaNorm = window.normalizarTexto(docaSel);
            let naFila = window.ymsStore.agendamentos.filter(i => i.docasSequencia && window.normalizarTexto(i.docasSequencia[i.indexDocaAtual]) === docaNorm && i.status === 'TRIAGEM_FISCAL');
            if (containerFila) {
                naFila.forEach((item, idx) => {
                    containerFila.insertAdjacentHTML('beforeend', `<div class="bg-slate-900 p-3 rounded-xl border-l-4 border-emerald-500"><span class="text-xs font-bold text-white">${idx + 1}º - ${item.ticket}</span></div>`);
                });
            }
        };

        window.chamarProximoSms = function() {
            const docaSel = document.getElementById('selDocaOperador').value;
            const proximo = window.ymsStore.agendamentos.find(i => i.docasSequencia && window.normalizarTexto(i.docasSequencia[i.indexDocaAtual]) === window.normalizarTexto(docaSel) && i.status === 'TRIAGEM_FISCAL');
            if (proximo) {
                proximo.status = "EM_DESCARGA"; proximo.timeInicioDescarga = new Date().toISOString();
                window.salvarAgendamentosNaMemoria(); window.dispararSmsEtapa(proximo, 'EM_DESCARGA');
            }
        };

        window.finalizarDescargaDoca = function() {
            const docaSel = document.getElementById('selDocaOperador').value;
            const emDesc = window.ymsStore.agendamentos.find(i => i.docasSequencia && window.normalizarTexto(i.docasSequencia[i.indexDocaAtual]) === window.normalizarTexto(docaSel) && i.status === 'EM_DESCARGA');
            if (emDesc) {
                emDesc.timeFimDescarga = new Date().toISOString(); emDesc.indexDocaAtual += 1;
                if (emDesc.indexDocaAtual < emDesc.docasSequencia.length) emDesc.status = "TRIAGEM_FISCAL";
                else emDesc.status = "AGUARDANDO_CHECKOUT";
                window.salvarAgendamentosNaMemoria();
            }
        };

        window.renderizarModuloCheckout = function() {};
        window.confirmarSaidaPortaria = function() {};
        window.renderizarTabelaMotoristas = function() {};
        window.salvarMotoristaManual = function(e) { if (e && e.preventDefault) e.preventDefault(); };
        window.carregarGraficosTorre = function() {};
        window.exportarRelatorioExcelFormatado = function() {};

        window.exibirToast = function(titulo, sub, icone = "✨") {
            const toast = document.getElementById('toast');
            if (!toast) return;
            document.getElementById('toastIcon').textContent = icone;
            document.getElementById('toastTitulo').textContent = titulo;
            document.getElementById('toastSub').textContent = sub;
            toast.className = "fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 opacity-100 z-50 min-w-[320px]";
            setTimeout(() => { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 3500);
        };

        // 🚀 INICIALIZAÇÃO SEGURA (COMPATÍVEL COM MÓDULOS DE NAVEGADOR)
        function iniciarAplicacao() {
            setInterval(() => {
                const r = document.getElementById('relogioGlobal');
                if (r) r.innerHTML = `<span>🕒</span> <span>${new Date().toLocaleTimeString('pt-BR')}</span>`;
            }, 1000);

            const hojeIso = window.obterDataHojeISO();
            if (document.getElementById('inpData')) document.getElementById('inpData').value = hojeIso;
            if (document.getElementById('filtroDataFornecedor')) document.getElementById('filtroDataFornecedor').value = hojeIso;

            const selDoca = document.getElementById('inpDoca');
            if (selDoca) {
                selDoca.innerHTML = "";
                window.listaTodasDocas.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d; opt.textContent = d;
                    selDoca.appendChild(opt);
                });
            }

            const selDocaOp = document.getElementById('selDocaOperador');
            if (selDocaOp) {
                selDocaOp.innerHTML = "";
                window.listaTodasDocas.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d; opt.textContent = d;
                    selDocaOp.appendChild(opt);
                });
            }

            window.popularSelectFornecedores(listaPadrao60Fornecedores.map(f => f.empresa));
            window.atualizarHorariosDisponiveis();
            window.restaurarSessaoLocal();
            inicializarEscutadoresFirebase();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', iniciarAplicacao);
        } else {
            iniciarAplicacao();
        }
    </script>
